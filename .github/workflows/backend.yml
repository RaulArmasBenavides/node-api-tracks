name: Backend CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  BUCKET: unir-g2001-artifacts-902105781083

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Empaquetar código versionado
        run: git archive --format=zip -o backend.zip HEAD

      - name: Subir artefacto y script a S3
        run: |
          aws s3 cp backend.zip s3://$BUCKET/backend.zip
          aws s3 cp backend.zip s3://$BUCKET/releases/backend-${GITHUB_SHA}.zip
          aws s3 cp deploy/remote-backend.ps1 s3://$BUCKET/deploy/remote-backend.ps1

      - name: Desplegar en BACK-APP-G2001 (SSM)
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.BACK_INSTANCE_ID }}" \
            --document-name AWS-RunPowerShellScript --timeout-seconds 900 \
            --parameters "commands=[\"Read-S3Object -BucketName $BUCKET -Key backend.zip -File C:\backend.zip\",\"Read-S3Object -BucketName $BUCKET -Key deploy/remote-backend.ps1 -File C:\deploy-backend.ps1\",\"& C:\deploy-backend.ps1\"]" \
            --query Command.CommandId --output text)
          for i in $(seq 1 60); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.BACK_INSTANCE_ID }}" --query Status --output text)
            case "$ST" in Success) break;; Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.BACK_INSTANCE_ID }}" --query StandardErrorContent --output text; exit 1;; esac
            sleep 15
          done
          [ "$ST" = Success ] || { echo "timeout"; exit 1; }

      - name: Verificar salud en el ALB
        run: |
          for i in $(seq 1 30); do
            S=$(aws elbv2 describe-target-health --target-group-arn "${{ secrets.TG_BACK_ARN }}" --query "TargetHealthDescriptions[0].TargetHealth.State" --output text)
            echo "estado=$S"
            [ "$S" = healthy ] && exit 0
            sleep 20
          done
          exit 1
